spring.application.name=mobilezbd
spring.docker.compose.file=docker-compose.yml
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/mobilezbd}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:replace-this-with-a-long-secret-key-for-dev-only-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:admin@mobilezbd.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}