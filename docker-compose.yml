services:
  db:
    image: postgres:15
    container_name: mobilezbd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobilezbd}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${POSTGRES_DB:-mobilezbd}"]
      interval: 10s
      timeout: 5s
      retries: 8

  app:
    build: .
    container_name: mobilezbd-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mobilezbd}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-replace-with-long-secret-at-least-32-characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mobilezbd.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: 8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mobilezbd-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "9090:80"

volumes:
  postgres_data:
